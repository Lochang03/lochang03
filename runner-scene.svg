<svg viewBox="0 0 860 160" xmlns="http://www.w3.org/2000/svg" font-family="monospace" shape-rendering="crispEdges">
<rect width="860" height="160" fill="#0d1117"/>
<line x1="0" y1="120" x2="860" y2="120" stroke="#30363d" stroke-width="2" stroke-dasharray="6,6"/>
<rect x="280" y="96" width="14" height="24" fill="#f85149"/>
<rect x="480" y="96" width="14" height="24" fill="#f85149"/>
<rect x="650" y="96" width="14" height="24" fill="#f85149"/>
<g id="runner-x">
<animateTransform attributeName="transform" type="translate" from="0,0" to="820,0" begin="0s" dur="4.5s" repeatCount="indefinite" calcMode="linear"/>
<g id="runner-y" transform="translate(0,120)">
<rect id="legL" x="-6" y="-16" width="6" height="16" fill="#39d353"/><rect id="legR" x="0" y="-16" width="6" height="16" fill="#39d353"/><rect x="-7" y="-34" width="14" height="18" fill="#39d353"/><rect x="-5" y="-44" width="10" height="10" fill="#39d353"/>
<animateTransform attributeName="transform" type="translate" additive="sum" values="0,0; 0,-30; 0,0" keyTimes="0;0.5;1" keySplines="0.3 0 0.7 1;0.3 0 0.7 1" calcMode="spline" begin="1.27s" dur="0.54s" repeatCount="indefinite"/>
<animateTransform attributeName="transform" type="translate" additive="sum" values="0,0; 0,-30; 0,0" keyTimes="0;0.5;1" keySplines="0.3 0 0.7 1;0.3 0 0.7 1" calcMode="spline" begin="2.36s" dur="0.54s" repeatCount="indefinite"/>
<animateTransform attributeName="transform" type="translate" additive="sum" values="0,0; 0,-30; 0,0" keyTimes="0;0.5;1" keySplines="0.3 0 0.7 1;0.3 0 0.7 1" calcMode="spline" begin="3.30s" dur="0.54s" repeatCount="indefinite"/>
</g>
</g>
<style>#legL { animation: legswap 0.3s steps(2) infinite; }#legR { animation: legswap 0.3s steps(2) infinite reverse; }@keyframes legswap { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }</style>
</svg>